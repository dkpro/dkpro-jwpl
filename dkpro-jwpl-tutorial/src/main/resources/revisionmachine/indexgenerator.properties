# Sample IndexGenerator configuration for the RevisionMachine tutorial (see README.md of this
# module). The database must already contain the imported revisions table.
host=localhost
db=simplewiki_rev
user=USER
password=PASSWORD
# directory for SQL or CSV output; ignored if outputDatabase=true
output=/data/revisionmachine/
# write the index tables directly into the database (instead of SQL files)
outputDatabase=true
outputDatafile=false
charset=UTF-8
buffer=15000
maxAllowedPackets=16760832
